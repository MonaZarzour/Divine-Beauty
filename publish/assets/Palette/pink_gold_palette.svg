<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F8EEEE"/>
    <stop offset="35%" stop-color="#EACFD1"/>
    <stop offset="70%" stop-color="#D9B4B7"/>
    <stop offset="100%" stop-color="#C8959B"/>
  </linearGradient>
  <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8D682E"/>
    <stop offset="25%" stop-color="#C6A15B"/>
    <stop offset="48%" stop-color="#F4DFA1"/>
    <stop offset="58%" stop-color="#FFF1C2"/>
    <stop offset="75%" stop-color="#D1AA5D"/>
